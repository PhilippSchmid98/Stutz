version: '3.8'
services:
  flutter-app:
    # Removed since build is not possible from VS Code due to E:Drive
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: my-local-flutter-env:latest
    volumes:
      # Mountet dein lokales DevDrive in den Container
      - ../:/workspace:cached
    working_dir: /workspace
    # Hält den Container am Leben, bis VS Code sich verbindet
    command: sleep infinity
    # Wichtig für Windows-Host-Verbindungen
    extra_hosts:
      - "host.docker.internal:host-gateway"

  firebase-emulator:
    # Schlankes Node-Image für Firebase CLI
    image: node:20-alpine
    volumes:
      - ../:/workspace:cached
    working_dir: /workspace
    # Installiert CLI und startet Emulatoren (Pfade in firebase.json beachten)
    command: sh -c "npm install -g firebase-tools && firebase emulators:start --project demo-test"
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
